<table>
  <thead>
    <tr>
      <th>ID</th>
      <th>Nombre</th>
      <th>Apellidos</th>
      <th>Email</th>
    </tr>
  </thead>

  <tbody>
    @for (cliente of clientes(); track cliente.id) {
      <tr (click)="onClienteClick(cliente)">
        <td>{{ cliente.id }}</td>
        <td>{{ cliente.nombre }}</td>
        <td>{{ cliente.apellidos }}</td>
        <td>{{ cliente.email }}</td>
      </tr>
    }
  </tbody>
</table>
