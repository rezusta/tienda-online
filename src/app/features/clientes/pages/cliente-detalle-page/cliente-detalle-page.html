<section class="cliente-detalle">
  <h2>Detalle del cliente</h2>

  <div class="cliente-info">
    <div class="campo">
      <span class="etiqueta">ID</span>
      <span class="valor">{{ cliente.id }}</span>
    </div>

    <div class="campo">
      <span class="etiqueta">Nombre</span>
      <span class="valor">{{ cliente.nombre }}</span>
    </div>

    <div class="campo">
      <span class="etiqueta">Apellidos</span>
      <span class="valor">{{ cliente.apellidos }}</span>
    </div>

    <div class="campo">
      <span class="etiqueta">Email</span>
      <span class="valor">{{ cliente.email }}</span>
    </div>
  </div>
</section>
