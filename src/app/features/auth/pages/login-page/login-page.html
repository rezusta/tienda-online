<div class="login-page">
  <div class="login-card">
    <h2>Iniciar sesión</h2>
    <p class="subtitle">Introduce tus credenciales para continuar</p>

    <div class="form-group">
      <label for="user">Usuario</label>
      <input
        id="user"
        type="text"
        placeholder="Usuario"
        [formField]="loginForm.user"
      />

      @if (loginForm.user().touched() && loginForm.user().invalid()) {
        @for (error of loginForm.user().errors(); track error) {
          <span class="error">
            {{ error.message }}
          </span>
        }
      }

    </div>

    <div class="form-group">
      <label for="password">Contraseña</label>
      <input
        id="password"
        type="password"
        placeholder="Contraseña"
        [formField]="loginForm.pass"
      />
    </div>

    <button type="button" (click)="login()" [disabled]="loginForm().invalid()">
      Iniciar sesión
    </button>
  </div>
</div>
