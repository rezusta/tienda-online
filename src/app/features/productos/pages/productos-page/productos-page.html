<h2>Lista de productos</h2>

<div class="listado-container">
    <app-productos-listado-filtro (filtroProducto)="filtraProductos($event)"></app-productos-listado-filtro>
    @if (this.cargandoProductos()) {
        <p>Loading...</p>
    } @else if (this.errorProductos()) {
        <p>Error: {{ this.errorProductos()!.message }}</p>
    } @else {
        <app-productos-listado
            (productoSeleccionado)="seleccionDeProducto($event)"
            [productos]="listaproductos()"
        ></app-productos-listado>
    }
</div>
