<table>
  <thead>
    <tr>
      <th>ID</th>
      <th>Nombre</th>
      <th>Descripción</th>
      <th>Precio</th>
    </tr>
  </thead>

  <tbody>
    @for (producto of productos(); track producto.id) {
      <tr (click)="onProductoClick(producto)">
        <td>{{ producto.id }}</td>
        <td>{{ producto.nombre }}</td>
        <td>{{ producto.descripcion }}</td>
        <td>{{ producto.precio }}</td>
      </tr>
    }
  </tbody>
</table>
