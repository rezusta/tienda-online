<header>
  <h1>{{ titulo }}</h1>

  @if (autenticado()) {
    <nav>
      <a routerLink="productos">Productos</a>

      @if (esEditor()) {
        <a routerLink="clientes">Clientes</a>
      }
    </nav>

    <div class="logout">
      <span>{{nombreUsuarioAutenticado()}}, </span>
      <a (click)="logout.emit()">Logout</a>
    </div>
  }
</header>
