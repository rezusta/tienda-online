<header>
  <h1>{{ titulo }}</h1>

  @if (idLogged()){
    <nav>
      <a routerLink="productos">Productos</a>

      @if (isEditor()){
        <a routerLink="clientes">Clientes</a>
      }

    </nav>

    <div class="logout">
      @if (userLogged()){
        <span>{{ userLogged() }},</span>
      }

      <a (click)="logout.emit()">Logout</a>
    </div>
  }
</header>
